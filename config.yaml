log_dir: /var/log/vpsGuard
cache_dir: /var/cache/vpsGuard
mode: agent
agent_mode: hybrid

bootstrap:
  enabled: true
  ssh_port: 22
  allow_root: false

monitor:
  journal: true
  log_paths:
    - /var/log/auth.log
    - /var/log/syslog
  interval_seconds: 5

threat:
  abuseipdb_key: ""    # or env: VPSGUARD_ABUSEIPDB_KEY
  alienvault_key: ""   # or env: VPSGUARD_ALIENVAULT_KEY
  cache_ttl_hours: 24
  rate_limit_per_min: 10

scoring:
  abuseipdb_weight: 0.25
  alienvault_weight: 0.20
  behavior_weight: 0.30
  temporal_weight: 0.10
  central_weight: 0.15
  block_threshold: 60
  rate_limit_score: 40
  rate_limit_minutes: 5
  quarantine_score: 30
  quarantine_minutes: 15
  central_block_threshold: 80
  central_quarantine_threshold: 50
  behavior_window_minutes: 10
  behavior_threshold: 5
  temporal_ttl_hours: 168

firewall:
  table: vpsGuard
  set_name: blacklist
  set_name_v6: blacklist6
  default_block_hours: 24
  whitelist:
    - 127.0.0.1
    - ::1

notify:
  telegram_token: ""    # or env: VPSGUARD_TELEGRAM_TOKEN
  telegram_chat_id: "" # or env: VPSGUARD_TELEGRAM_CHAT_ID
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""         # or env: VPSGUARD_SMTP_PASS
  email_from: ""
  email_to: ""
  cooldown_minutes: 10

self_protect:
  watchdog_interval_seconds: 30
  enable_file_check: true
  config_checksum: ""

daily_report:
  enabled: false
  interval_hours: 24
  send_telegram: true
  send_email: false

central_feed:
  enabled: false
  api_url: "https://your-platform.com/api/v1/threat-feed"
  api_token: ""         # or env: VPSGUARD_CENTRAL_TOKEN
  sync_interval_seconds: 60
  min_confidence: 50

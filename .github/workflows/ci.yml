name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -race ./...

      - name: Build
        run: go build -ldflags="-s -w" -o vps-guard ./cmd/vps-guard/

      - name: Version check
        run: ./vps-guard -version

      - name: Binary size
        run: ls -lh vps-guard

  cross-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Cross-compile all targets
        run: make cross-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
